<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Einstellungen - Sizilien 2026</title>
<link rel="stylesheet" href="../shared/styles.css" />
<style>
  .settings-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--space-5);
    margin-bottom: var(--space-8);
  }
  .settings-card {
    background: var(--surface-card);
    border: 1px solid var(--gray-100);
    border-radius: var(--radius-md);
    padding: var(--space-6);
    box-shadow: var(--shadow-md);
  }
  .settings-card h3 {
    margin: 0 0 var(--space-4);
    color: var(--primary);
    display: flex;
    align-items: center;
    gap: var(--space-2);
  }
  .settings-card h3 svg { width: 20px; height: 20px; }
  .person-card {
    background: var(--gray-50);
    border: 1px solid var(--gray-100);
    border-radius: var(--radius-sm);
    padding: var(--space-3) var(--space-4);
    margin-bottom: var(--space-3);
  }
  .person-card-header {
    display: flex;
    align-items: center;
    gap: var(--space-3);
  }
  .person-card-header .num {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--primary);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: .75rem;
    font-weight: 600;
    flex-shrink: 0;
  }
  .person-card-header input[type="text"] { flex: 1; }
  .person-card-header .btn-icon { flex-shrink: 0; }
  .person-card-details {
    display: flex;
    align-items: center;
    gap: var(--space-4);
    margin-top: var(--space-2);
    padding-left: 40px;
    flex-wrap: wrap;
  }
  .person-card-details label {
    display: flex;
    align-items: center;
    gap: var(--space-1);
    font-size: .8125rem;
    color: var(--gray-700);
    cursor: pointer;
    white-space: nowrap;
  }
  .person-card-details label svg { width: 14px; height: 14px; color: var(--gray-400); }
  .person-card-details input[type="checkbox"] {
    width: 16px;
    height: 16px;
    accent-color: var(--success);
    cursor: pointer;
  }
  .person-card-details input[type="text"] {
    flex: 1;
    min-width: 100px;
    max-width: 200px;
  }
  .danger-zone {
    border-color: var(--error-light);
    background: var(--error-light);
  }
  .danger-zone h3 { color: var(--error); }
  .current-config {
    background: var(--surface-inset);
    border-radius: var(--radius-sm);
    padding: var(--space-4);
    font-size: .8125rem;
    font-family: 'Inter', monospace;
    margin-top: var(--space-4);
    max-height: 200px;
    overflow-y: auto;
  }
  @media (max-width: 768px) {
    .settings-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<a href="#main-content" class="skip-link">Zum Inhalt springen</a>
<div id="site-nav" data-depth="1" data-title=""></div>

<header>
  <h1>Einstellungen</h1>
  <p>Reisekonfiguration anpassen</p>
</header>

<div class="container" id="main-content">

  <div class="settings-grid">

    <div class="settings-card">
      <h3 id="reise-heading"></h3>
      <div class="form-grid" style="grid-template-columns:1fr">
        <div class="form-group">
          <label>Reisename</label>
          <input id="s-tripName" type="text" placeholder="z.B. Sizilien 2026">
        </div>
        <div class="form-group">
          <label>Zielort</label>
          <input id="s-zielort" type="text" placeholder="z.B. Palermo, Sizilien">
        </div>
        <div class="form-group">
          <label>Zielflughafen</label>
          <input id="s-zielflughafen" type="text" placeholder="z.B. Palermo (PMO)">
        </div>
        <div class="form-group">
          <label>Reisebeginn</label>
          <input id="s-von" type="date">
        </div>
        <div class="form-group">
          <label>Reiseende</label>
          <input id="s-bis" type="date">
        </div>
        <div class="form-group">
          <label>Waehrung</label>
          <select id="s-waehrung">
            <option value="EUR">EUR (Euro)</option>
            <option value="USD">USD (Dollar)</option>
            <option value="GBP">GBP (Pfund)</option>
            <option value="CHF">CHF (Franken)</option>
          </select>
        </div>
      </div>
    </div>

    <div class="settings-card">
      <h3 id="personen-heading"></h3>
      <p class="text-muted text-sm" style="margin-bottom:var(--space-4)">Personen hinzufuegen oder entfernen. Die Namen werden auf allen Seiten verwendet.</p>
      <div id="personen-list"></div>
      <button class="btn btn-ghost btn-sm" onclick="addPerson()" style="margin-top:var(--space-3)" id="add-person-btn"></button>
    </div>

    <div class="settings-card">
      <h3 id="karte-heading"></h3>
      <div class="form-grid" style="grid-template-columns:1fr 1fr">
        <div class="form-group">
          <label>Breitengrad (Lat)</label>
          <input id="s-mapLat" type="number" step="0.001" placeholder="38.145">
        </div>
        <div class="form-group">
          <label>Laengengrad (Lng)</label>
          <input id="s-mapLng" type="number" step="0.001" placeholder="13.30">
        </div>
        <div class="form-group">
          <label>Zoom-Stufe</label>
          <input id="s-mapZoom" type="number" min="5" max="18" placeholder="12">
        </div>
      </div>
    </div>

    <div class="settings-card danger-zone">
      <h3 id="danger-heading"></h3>
      <p class="text-sm" style="margin-bottom:var(--space-4);color:var(--gray-700)">Alle Einstellungen auf die Standardwerte zuruecksetzen. Deine Daten (Hotels, Fluege etc.) werden nicht geloescht.</p>
      <button class="btn btn-danger" onclick="resetConfig()" id="reset-btn"></button>
    </div>

  </div>

  <div class="form-actions" style="justify-content:center;margin-bottom:var(--space-8)">
    <button class="btn btn-primary btn-lg" onclick="saveSettings()" id="save-btn"></button>
    <button class="btn btn-ghost btn-lg" onclick="loadSettings()" id="discard-btn"></button>
  </div>

</div>

<footer></footer>

<script src="../shared/icons.js"></script>
<script src="../shared/config.js"></script>
<script src="../shared/data.js"></script>
<script src="../shared/helpers.js"></script>
<script src="../shared/personen.js"></script>
<script src="../shared/nav.js"></script>
<script>
// Set heading content with icons
document.getElementById('reise-heading').innerHTML = Icons.globe({size:20}) + ' Reisedaten';
document.getElementById('personen-heading').innerHTML = Icons.users({size:20}) + ' Reisegruppe';
document.getElementById('karte-heading').innerHTML = Icons.mapPin({size:20}) + ' Karteneinstellungen';
document.getElementById('danger-heading').innerHTML = Icons.alertTriangle({size:20}) + ' Zuruecksetzen';
document.getElementById('add-person-btn').innerHTML = Icons.plus({size:14}) + ' Person hinzufuegen';
document.getElementById('save-btn').innerHTML = Icons.check({size:16}) + ' Einstellungen speichern';
document.getElementById('discard-btn').innerHTML = Icons.refresh({size:16}) + ' Aenderungen verwerfen';
document.getElementById('reset-btn').innerHTML = Icons.trash({size:14}) + ' Auf Standardwerte zuruecksetzen';

var personenDaten = [];

function loadSettings() {
  var c = SizilienConfig.load();
  document.getElementById('s-tripName').value = c.tripName || '';
  document.getElementById('s-zielort').value = c.zielort || '';
  document.getElementById('s-zielflughafen').value = c.zielflughafen || '';
  document.getElementById('s-von').value = c.reisezeitraum.von || '';
  document.getElementById('s-bis').value = c.reisezeitraum.bis || '';
  document.getElementById('s-waehrung').value = c.waehrung || 'EUR';
  document.getElementById('s-mapLat').value = c.mapCenter.lat || '';
  document.getElementById('s-mapLng').value = c.mapCenter.lng || '';
  document.getElementById('s-mapZoom').value = c.mapZoom || 12;
  personenDaten = (c.personenDaten || []).map(function(p) {
    return { name: p.name || '', fuehrerschein: !!p.fuehrerschein, faehrtImAusland: !!p.faehrtImAusland, notizen: p.notizen || '' };
  });
  if (personenDaten.length === 0 && c.personenNamen) {
    personenDaten = c.personenNamen.map(function(n) {
      return { name: n, fuehrerschein: false, faehrtImAusland: false, notizen: '' };
    });
  }
  renderPersonen();
}

function renderPersonen() {
  var html = '';
  personenDaten.forEach(function(p, i) {
    var auslandDisabled = !p.fuehrerschein ? ' disabled' : '';
    html += '<div class="person-card">' +
      '<div class="person-card-header">' +
        '<span class="num">' + (i+1) + '</span>' +
        '<input type="text" value="' + esc(p.name) + '" data-field="name" data-idx="' + i + '" placeholder="Name eingeben">' +
        '<button class="btn-icon" onclick="removePerson(' + i + ')" aria-label="Person entfernen" title="Entfernen">' + Icons.trash({size:16}) + '</button>' +
      '</div>' +
      '<div class="person-card-details">' +
        '<label>' + Icons.car({size:14}) +
          '<input type="checkbox" data-field="fuehrerschein" data-idx="' + i + '"' + (p.fuehrerschein ? ' checked' : '') +
          ' onchange="toggleFuehrerschein(' + i + ',this.checked)"> Fuehrerschein</label>' +
        '<label>' + Icons.globe({size:14}) +
          '<input type="checkbox" data-field="faehrtImAusland" data-idx="' + i + '"' + (p.faehrtImAusland ? ' checked' : '') +
          auslandDisabled + '> Faehrt im Ausland</label>' +
        '<input type="text" value="' + esc(p.notizen) + '" data-field="notizen" data-idx="' + i + '" placeholder="Notizen (z.B. Nur Automatik)">' +
      '</div>' +
    '</div>';
  });
  document.getElementById('personen-list').innerHTML = html;
}

function toggleFuehrerschein(idx, checked) {
  personenDaten[idx].fuehrerschein = checked;
  if (!checked) personenDaten[idx].faehrtImAusland = false;
  renderPersonen();
}

function addPerson() {
  personenDaten.push({ name: 'Person ' + (personenDaten.length + 1), fuehrerschein: false, faehrtImAusland: false, notizen: '' });
  renderPersonen();
}

function removePerson(idx) {
  if (personenDaten.length <= 1) {
    toast('Mindestens eine Person erforderlich', 'error');
    return;
  }
  personenDaten.splice(idx, 1);
  renderPersonen();
}

function readPersonenFromDOM() {
  document.querySelectorAll('.person-card').forEach(function(card, i) {
    var nameInput = card.querySelector('input[data-field="name"]');
    var fsInput = card.querySelector('input[data-field="fuehrerschein"]');
    var auslandInput = card.querySelector('input[data-field="faehrtImAusland"]');
    var notizenInput = card.querySelector('input[data-field="notizen"]');
    if (nameInput) personenDaten[i].name = nameInput.value.trim() || ('Person ' + (i+1));
    if (fsInput) personenDaten[i].fuehrerschein = fsInput.checked;
    if (auslandInput) personenDaten[i].faehrtImAusland = auslandInput.checked;
    if (notizenInput) personenDaten[i].notizen = notizenInput.value.trim();
  });
}

function saveSettings() {
  readPersonenFromDOM();

  var config = {
    tripName: document.getElementById('s-tripName').value.trim(),
    personenDaten: personenDaten,
    reisezeitraum: {
      von: document.getElementById('s-von').value,
      bis: document.getElementById('s-bis').value
    },
    zielort: document.getElementById('s-zielort').value.trim(),
    zielflughafen: document.getElementById('s-zielflughafen').value.trim(),
    waehrung: document.getElementById('s-waehrung').value,
    mapCenter: {
      lat: parseFloat(document.getElementById('s-mapLat').value) || 38.145,
      lng: parseFloat(document.getElementById('s-mapLng').value) || 13.30
    },
    mapZoom: parseInt(document.getElementById('s-mapZoom').value) || 12
  };

  SizilienConfig.save(config);
  toast('Einstellungen gespeichert!');
  renderFooter();
}

function resetConfig() {
  confirmModal(
    'Einstellungen zuruecksetzen?',
    'Alle Einstellungen werden auf die Standardwerte zurueckgesetzt. Deine Reisedaten (Hotels, Fluege etc.) bleiben erhalten.',
    function() {
      SizilienConfig.reset();
      loadSettings();
      renderFooter();
      toast('Einstellungen zurueckgesetzt');
    },
    { danger: true, confirmLabel: 'Zuruecksetzen' }
  );
}

loadSettings();
</script>
</body>
</html>
