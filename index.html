<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sizilien Urlaub Juni 2026 - Reiseplanung</title>
<link rel="stylesheet" href="shared/styles.css" />
<style>
  .hero {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
    color: #fff;
    padding: var(--space-16) var(--space-5) var(--space-12);
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .hero h1 { font-size: 2.5rem; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.025em; line-height: 1.15; }
  .hero .subtitle { font-size: 1.1em; opacity: .88; margin-bottom: var(--space-6); }
  .hero .trip-info {
    display: flex;
    justify-content: center;
    gap: var(--space-8);
    flex-wrap: wrap;
    font-size: .875rem;
    opacity: .85;
  }
  .hero .trip-info span {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .hero .trip-info svg { width: 16px; height: 16px; opacity: .9; }

  .countdown {
    background: var(--surface-card);
    border: 1px solid var(--gray-100);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-lg);
    padding: var(--space-6);
    max-width: 600px;
    margin: -30px auto var(--space-8);
    position: relative;
    z-index: 10;
    text-align: center;
  }
  .countdown h2 { border: none; margin: 0 0 var(--space-3); font-size: 1rem; color: var(--gray-500); font-weight: 500; }
  .countdown-grid {
    display: flex;
    justify-content: center;
    gap: var(--space-8);
  }
  .countdown-item { text-align: center; }
  .countdown-num {
    font-size: 2.2rem;
    font-weight: 700;
    color: var(--primary);
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .countdown-label {
    font-size: .75rem;
    color: var(--gray-400);
    font-weight: 500;
    margin-top: 4px;
    letter-spacing: 0.01em;
  }

  .nav-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: var(--space-5);
    margin: var(--space-5) 0 var(--space-8);
  }
  .nav-card {
    background: var(--surface-card);
    border: 1px solid var(--gray-100);
    border-radius: var(--radius-md);
    padding: var(--space-8) var(--space-6);
    text-decoration: none;
    color: var(--gray-900);
    box-shadow: var(--shadow-md);
    transition: transform var(--duration-fast) var(--ease),
                box-shadow var(--duration-fast) var(--ease),
                border-color var(--duration-fast) var(--ease);
    text-align: center;
  }
  .nav-card:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-hover);
    border-color: rgba(61,122,158,.3);
  }
  .nav-card .card-icon {
    margin-bottom: var(--space-3);
    color: var(--primary);
    display: flex;
    justify-content: center;
  }
  .nav-card .card-icon svg { width: 32px; height: 32px; }
  .nav-card h3 { margin: 0 0 6px; font-size: 1.05rem; color: var(--gray-900); }
  .nav-card p { font-size: .8125rem; color: var(--gray-500); margin: 0; line-height: 1.5; }
  .nav-card .card-badge {
    display: inline-block;
    background: var(--info-light);
    color: var(--primary);
    padding: 2px 10px;
    border-radius: var(--radius-lg);
    font-size: .6875rem;
    font-weight: 600;
    margin-top: var(--space-3);
    letter-spacing: 0.02em;
  }

  .quick-stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: var(--space-4);
    margin-bottom: var(--space-8);
  }
  .stat-card {
    background: var(--surface-card);
    border: 1px solid var(--gray-100);
    border-radius: var(--radius-md);
    padding: var(--space-5);
    box-shadow: var(--shadow-sm);
    display: flex;
    align-items: center;
    gap: var(--space-3);
  }
  .stat-icon {
    color: var(--primary-light);
    flex-shrink: 0;
  }
  .stat-icon svg { width: 24px; height: 24px; }
  .stat-info h4 { font-size: .75rem; color: var(--gray-400); font-weight: 500; margin: 0; letter-spacing: 0.01em; }
  .stat-info .stat-val { font-size: 1.2rem; font-weight: 700; color: var(--primary); font-variant-numeric: tabular-nums; }
  .stat-info .stat-val.accent { color: var(--accent); }

  @media (max-width: 768px) {
    .nav-grid { grid-template-columns: 1fr 1fr; }
    .hero h1 { font-size: 2rem; }
    .hero .trip-info { gap: var(--space-4); font-size: .8125rem; }
    .countdown-num { font-size: 1.6rem; }
    .countdown-grid { gap: var(--space-5); }
  }
  @media (max-width: 480px) {
    .nav-grid { grid-template-columns: 1fr; }
    .hero h1 { font-size: 1.6rem; }
    .hero { padding: var(--space-12) var(--space-5) var(--space-10); }
  }
</style>
</head>
<body>

<a href="#main-content" class="skip-link">Zum Inhalt springen</a>
<div id="site-nav" data-depth="0"></div>

<div class="hero">
  <h1 id="hero-title">Sizilien 2026</h1>
  <p class="subtitle">Gruppenurlaub</p>
  <div class="trip-info" id="hero-info"></div>
</div>

<div class="countdown" id="countdown">
  <h2>Countdown bis zum Abflug</h2>
  <div class="countdown-grid" id="countdown-grid"></div>
</div>

<div class="container" id="main-content">

  <h2>Schnell&uuml;bersicht</h2>
  <div class="quick-stats" id="quick-stats"></div>

  <h2>Wetter im Juni</h2>
  <div class="quick-stats" id="weather-stats"></div>

  <h2>N&auml;chste Aufgaben</h2>
  <div id="todo-quickview" style="margin-bottom:25px"></div>

  <h2>Reiseplanung</h2>
  <div class="nav-grid" id="nav-grid"></div>

</div>

<footer></footer>

<script src="shared/icons.js"></script>
<script src="shared/config.js"></script>
<script src="shared/data.js"></script>
<script src="shared/helpers.js"></script>
<script src="shared/personen.js"></script>
<script src="shared/nav.js"></script>
<script>
(function() {
  var config = SizilienConfig.load();

  // Hero
  document.getElementById('hero-title').textContent = config.tripName || 'Sizilien 2026';
  document.querySelector('.hero .subtitle').textContent = 'Gruppenurlaub \u00B7 ' + (config.zielort || '');
  document.getElementById('hero-info').innerHTML =
    '<span>' + Icons.calendar({size:16}) + ' ' + SizilienConfig.formatDateRange() + '</span>' +
    '<span>' + Icons.users({size:16}) + ' ' + config.personen + ' Personen</span>' +
    '<span>' + Icons.mapPin({size:16}) + ' ' + esc(config.zielort) + '</span>';

  // Countdown
  var target = new Date(config.reisezeitraum.von + 'T00:00:00');
  function updateCountdown() {
    var now = new Date();
    var diff = target - now;
    if (diff <= 0) {
      document.getElementById('countdown-grid').innerHTML =
        '<div style="font-size:1.2em;font-weight:700;color:var(--success)">' + Icons.checkCircle({size:24}) + ' Der Urlaub hat begonnen!</div>';
      return;
    }
    var days = Math.floor(diff / 86400000);
    var hours = Math.floor((diff % 86400000) / 3600000);
    var mins = Math.floor((diff % 3600000) / 60000);
    var secs = Math.floor((diff % 60000) / 1000);
    document.getElementById('countdown-grid').innerHTML =
      cd(days, 'Tage') + cd(hours, 'Stunden') + cd(mins, 'Minuten') + cd(secs, 'Sekunden');
  }
  function cd(n, label) {
    return '<div class="countdown-item"><div class="countdown-num">' + n + '</div><div class="countdown-label">' + label + '</div></div>';
  }
  updateCountdown();
  setInterval(updateCountdown, 1000);

  // Quick Stats
  var hotels = DataStore.get('hotels');
  var hotelCount = hotels ? hotels.length : 0;
  var cheapest = 0;
  if (hotels && hotels.length) {
    cheapest = Math.min.apply(null, hotels.map(function(h) { return h.totalPrice; }));
  }
  var fluege = DataStore.get('fluege');
  var flugCount = fluege ? fluege.length : 0;

  document.getElementById('quick-stats').innerHTML =
    statCard(Icons.building({size:24}), 'Unterk\u00FCnfte verglichen', hotelCount > 0 ? hotelCount : '\u2013') +
    statCard(Icons.plane({size:24}), 'Fl\u00FCge eingetragen', flugCount > 0 ? flugCount : 'Noch offen') +
    statCard(Icons.car({size:24}), 'Mietwagen', 'Noch offen') +
    statCard(Icons.euro({size:24}), 'G\u00FCnstigste Unterkunft', cheapest > 0 ? 'ab ' + cheapest + ' \u20AC' : '\u2013', true);

  function statCard(icon, label, val, isAccent) {
    return '<div class="stat-card">' +
      '<div class="stat-icon">' + icon + '</div>' +
      '<div class="stat-info"><h4>' + label + '</h4>' +
      '<div class="stat-val' + (isAccent ? ' accent' : '') + '">' + val + '</div></div></div>';
  }

  // Weather Stats (SVG icons instead of emojis)
  document.getElementById('weather-stats').innerHTML =
    statCard(Icons.sunMedium({size:24}), 'Temperatur', '19\u201328\u00B0C') +
    statCard(Icons.waves({size:24}), 'Wassertemp.', '22\u00B0C') +
    statCard(Icons.sunMedium({size:24}), 'Sonnenstunden', '11h / Tag') +
    statCard(Icons.umbrella({size:24}), 'Regentage', '~2 Tage', true);

  // Nav Grid
  var sections = [
    { href: 'unterkuenfte/index.html', icon: 'building', title: 'Unterk\u00FCnfte', desc: '\u00DCbersicht & Vergleich aller Unterkunftsoptionen mit Karte, Rankings und Details', badge: hotelCount > 0 ? hotelCount + ' verglichen' : 'Planen' },
    { href: 'fluege/index.html', icon: 'plane', title: 'Fl\u00FCge', desc: 'Flugvergleich, Buchungsstatus und Preise f\u00FCr alle Mitreisenden', badge: flugCount > 0 ? flugCount + ' eingetragen' : 'Planen' },
    { href: 'auto/index.html', icon: 'car', title: 'Auto & Transport', desc: 'Mietwagen, Fahrer-\u00DCbersicht, \u00D6PNV-Infos und Kosten-Splitting', badge: 'Planen' },
    { href: 'aktivitaeten/index.html', icon: 'mapPin', title: 'Aktivit\u00E4ten', desc: 'Sehensw\u00FCrdigkeiten, Str\u00E4nde, Restaurants und Ausfl\u00FCge', badge: 'Entdecken' },
    { href: 'abstimmungen/index.html', icon: 'listChecks', title: 'Abstimmungen', desc: 'Voting f\u00FCr Unterk\u00FCnfte, Aktivit\u00E4ten und Zeitr\u00E4ume', badge: 'Abstimmen' },
    { href: 'tagesplan/index.html', icon: 'calendar', title: 'Tagesplan', desc: 'Tag-f\u00FCr-Tag Planung mit Aktivit\u00E4ten und Mahlzeiten', badge: 'Planen' },
    { href: 'aufgaben/index.html', icon: 'listChecks', title: 'Aufgaben', desc: 'To-Do-Board mit Zust\u00E4ndigkeiten und Deadlines', badge: 'Organisieren' },
    { href: 'ideenwand/index.html', icon: 'mapPin', title: 'Ideenwand', desc: 'Brainstorming-Board f\u00FCr Ausflugsideen und Vorschl\u00E4ge', badge: 'Ideen' },
    { href: 'packliste/index.html', icon: 'listChecks', title: 'Packliste', desc: 'Gemeinsame und pers\u00F6nliche Checkliste + Wer bringt was?', badge: 'Abhaken' },
    { href: 'budget/index.html', icon: 'wallet', title: 'Budget', desc: 'Kosten\u00FCbersicht, Ausgaben-Tracker und Schulden-Rechner', badge: 'Planen' },
    { href: 'infos/index.html', icon: 'mapPin', title: 'Praktische Infos', desc: 'Notfallnummern, Tipps, Wetter, Sprachf\u00FChrer und Spezialit\u00E4ten', badge: 'Infos' }
  ];

  document.getElementById('nav-grid').innerHTML = sections.map(function(s) {
    var iconHtml = (typeof Icons !== 'undefined' && Icons[s.icon]) ? Icons[s.icon]({size:32}) : '';
    return '<a href="' + s.href + '" class="nav-card">' +
      '<div class="card-icon">' + iconHtml + '</div>' +
      '<h3>' + s.title + '</h3>' +
      '<p>' + s.desc + '</p>' +
      '<span class="card-badge">' + s.badge + '</span>' +
    '</a>';
  }).join('');

  // Todo Quickview
  var defaultTodos = [
    { text: 'Unterkunft ausw\u00E4hlen', deadline: '2026-04-15', status: 'offen' },
    { text: 'Fl\u00FCge buchen', deadline: '2026-04-30', status: 'offen' },
    { text: 'Mietwagen reservieren', deadline: '2026-05-15', status: 'offen' },
    { text: 'Reiseversicherung abschlie\u00DFen', deadline: '2026-05-20', status: 'offen' },
    { text: 'Packliste durchgehen', deadline: '2026-05-28', status: 'offen' }
  ];
  var savedTodos;
  try { savedTodos = JSON.parse(localStorage.getItem('sizilien2026_todos')); } catch(e) {}
  var todos = savedTodos || defaultTodos;
  var openTodos = todos.filter(function(t) { return t.status === 'offen' || t.status === 'in_bearbeitung'; });
  var todoHtml = '';
  if (openTodos.length === 0) {
    todoHtml = '<div style="text-align:center;padding:15px;color:var(--success);font-weight:600">Alle Aufgaben erledigt!</div>';
  } else {
    openTodos.slice(0, 5).forEach(function(t) {
      var isOverdue = t.deadline && new Date(t.deadline) < new Date();
      todoHtml += '<div style="display:flex;align-items:center;gap:10px;padding:10px 15px;background:var(--surface-card,#fff);border:1px solid var(--gray-100,#eee);border-radius:8px;margin-bottom:6px' + (isOverdue ? ';border-left:3px solid var(--error,#c0392b)' : '') + '">' +
        '<span style="font-size:.85em;flex:1">' + t.text + '</span>' +
        (t.deadline ? '<span style="font-size:.75em;color:' + (isOverdue ? 'var(--error,#c0392b)' : 'var(--gray-400,#999)') + '">' + t.deadline + '</span>' : '') +
      '</div>';
    });
    todoHtml += '<a href="aufgaben/index.html" style="display:block;text-align:center;font-size:.85em;color:var(--primary-light,#2980b9);margin-top:8px">Alle Aufgaben anzeigen \u2192</a>';
  }
  document.getElementById('todo-quickview').innerHTML = todoHtml;
})();
</script>
</body>
</html>
