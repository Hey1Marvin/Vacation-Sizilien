<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Packliste - Sizilien 2026</title>
<link rel="stylesheet" href="../shared/styles.css" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<a href="#main-content" class="skip-link">Zum Inhalt springen</a>
<div id="site-nav" data-depth="1" data-title=""></div>

<header>
  <h1>Packliste</h1>
  <p>Gemeinsame &amp; pers&ouml;nliche Checkliste &middot; Sizilien Juni 2026</p>
</header>

<div class="container" id="main-content">

  <div class="total-progress" id="total-progress"></div>

  <h2>Gemeinsame Sachen</h2>
  <p class="text-muted text-sm" style="margin-bottom:var(--space-4)">Sachen, die die Gruppe zusammen braucht &mdash; Zust&auml;ndigkeit festlegen!</p>
  <div id="gemeinsam-list"></div>

  <h2>Pers&ouml;nliche Packliste</h2>
  <p class="text-muted text-sm" style="margin-bottom:var(--space-4)">Dein Fortschritt wird im Browser gespeichert (localStorage).</p>
  <div id="persoenlich-list"></div>

  <div class="reset-btn">
    <button class="btn btn-danger" onclick="resetAll()">Alle Haken zur&uuml;cksetzen</button>
  </div>

</div>

<div class="toast" id="toast"></div>
<footer></footer>

<script src="../shared/icons.js"></script>
<script src="../shared/config.js"></script>
<script src="../shared/data.js"></script>
<script src="../shared/helpers.js"></script>
<script src="../shared/personen.js"></script>
<script src="../shared/nav.js"></script>
<script src="packliste.js"></script>
<script>
var STORAGE_KEY = 'sizilien2026_packliste';

/* ─── Icon mapping: category id -> Icons function ─── */
var CATEGORY_ICONS = {
  kleidung:  function() { return Icons.shirt({size: 20}); },
  hygiene:   function() { return Icons.droplets({size: 20}); },
  elektronik: function() { return Icons.plug({size: 20}); },
  dokumente: function() { return Icons.fileText({size: 20}); },
  strand:    function() { return Icons.sunMedium({size: 20}); },
  sonstiges: function() { return Icons.backpack({size: 20}); },
  gemeinsam: function() { return Icons.package({size: 20}); }
};

function getCategoryIcon(id) {
  return CATEGORY_ICONS[id] ? CATEGORY_ICONS[id]() : '';
}

function loadState() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
  } catch(e) { return {}; }
}

function saveState(state) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function toggleItem(key) {
  var state = loadState();
  state[key] = !state[key];
  saveState(state);
  renderAll();
}

var ZUSTAENDIG_KEY = 'sizilien2026_zustaendig';
function loadZustaendig() {
  try { return JSON.parse(localStorage.getItem(ZUSTAENDIG_KEY)) || {}; } catch(e) { return {}; }
}
function saveZustaendig(data) { localStorage.setItem(ZUSTAENDIG_KEY, JSON.stringify(data)); }

function assignPerson(itemId, personId) {
  var z = loadZustaendig();
  z[itemId] = personId;
  saveZustaendig(z);
  renderGemeinsam();
  var r = getReisenderById(personId);
  toast((r ? r.name : personId) + ' ist jetzt zust\u00E4ndig!');
}

function renderGemeinsam() {
  var state = loadState();
  var zustaendig = loadZustaendig();
  var checked = 0;
  var total = PACKLISTE_GEMEINSAM.length;

  var items = PACKLISTE_GEMEINSAM.map(function(g) {
    var isChecked = !!state[g.id];
    if (isChecked) checked++;
    var assignedId = zustaendig[g.id] || '';
    var assignedR = assignedId ? getReisenderById(assignedId) : null;

    var personBtns = '<div class="zustaendig-btns">';
    REISENDE.forEach(function(r) {
      var isAssigned = r.id === assignedId;
      personBtns += '<button class="zustaendig-btn' + (isAssigned ? ' active' : '') + '" ' +
        'style="' + (isAssigned ? 'background:' + r.farbe + ';color:#fff;border-color:' + r.farbe : '') + '" ' +
        'onclick="assignPerson(\'' + g.id + '\',\'' + r.id + '\')" title="' + esc(r.name) + '">' +
        esc(r.initialen) + '</button>';
    });
    personBtns += '</div>';

    return '<div class="check-item' + (isChecked ? ' checked' : '') + '">' +
      '<input type="checkbox" id="' + g.id + '"' + (isChecked ? ' checked' : '') +
      ' onchange="toggleItem(\'' + g.id + '\')">' +
      '<label for="' + g.id + '">' + esc(g.item) + '</label>' +
      (assignedR ? '<span class="zustaendig" style="color:' + assignedR.farbe + ';font-weight:600">' + renderInitiale(assignedR, 20) + ' ' + esc(assignedR.name) + '</span>' : '') +
      personBtns +
    '</div>';
  }).join('');

  var pct = total > 0 ? Math.round(checked / total * 100) : 0;
  var chevronIcon = Icons.chevronRight({size: 18});

  document.getElementById('gemeinsam-list').innerHTML =
    '<details class="collapsible" open>' +
      '<summary>' +
        '<span class="chevron">' + chevronIcon + '</span>' +
        getCategoryIcon('gemeinsam') +
        ' Gemeinsame Items' +
        '<span class="summary-meta">' + checked + '/' + total + ' (' + pct + '%)</span>' +
      '</summary>' +
      '<div class="collapsible-content">' +
        '<div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
        items +
      '</div>' +
    '</details>';
}

function renderPersoenlich() {
  var state = loadState();

  document.getElementById('persoenlich-list').innerHTML = PACKLISTE_KATEGORIEN.map(function(kat) {
    var checked = 0;
    var total = kat.items.length;

    var items = kat.items.map(function(item, i) {
      var key = kat.id + '_' + i;
      var isChecked = !!state[key];
      if (isChecked) checked++;
      return '<div class="check-item' + (isChecked ? ' checked' : '') + '">' +
        '<input type="checkbox" id="' + key + '"' + (isChecked ? ' checked' : '') +
        ' onchange="toggleItem(\'' + key + '\')">' +
        '<label for="' + key + '">' + esc(item) + '</label>' +
      '</div>';
    }).join('');

    var pct = total > 0 ? Math.round(checked / total * 100) : 0;
    var chevronIcon = Icons.chevronRight({size: 18});
    var catIcon = getCategoryIcon(kat.id);

    return '<details class="collapsible" open>' +
      '<summary>' +
        '<span class="chevron">' + chevronIcon + '</span>' +
        catIcon +
        ' ' + esc(kat.name) +
        '<span class="summary-meta">' + checked + '/' + total + ' (' + pct + '%)</span>' +
      '</summary>' +
      '<div class="collapsible-content">' +
        '<div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
        items +
      '</div>' +
    '</details>';
  }).join('');
}

function renderTotalProgress() {
  var state = loadState();
  var total = PACKLISTE_GEMEINSAM.length;
  PACKLISTE_KATEGORIEN.forEach(function(k) { total += k.items.length; });

  var checked = 0;
  PACKLISTE_GEMEINSAM.forEach(function(g) { if (state[g.id]) checked++; });
  PACKLISTE_KATEGORIEN.forEach(function(k) {
    k.items.forEach(function(item, i) {
      if (state[k.id + '_' + i]) checked++;
    });
  });

  var pct = total > 0 ? Math.round(checked / total * 100) : 0;
  var icon = pct === 100 ? Icons.checkCircle({size: 24}) : Icons.listChecks({size: 24});

  document.getElementById('total-progress').innerHTML =
    '<div class="text-muted text-sm" style="margin-bottom:var(--space-1)">Gesamtfortschritt</div>' +
    '<div class="big-num">' + pct + '%</div>' +
    '<div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
    '<div class="text-muted text-xs">' + icon + ' ' + checked + ' von ' + total + ' Items abgehakt</div>';
}

function renderAll() {
  renderTotalProgress();
  renderGemeinsam();
  renderPersoenlich();
}

function resetAll() {
  confirmModal(
    'Packliste zur\u00FCcksetzen',
    'Wirklich alle Haken zur\u00FCcksetzen? Dein gesamter Fortschritt geht verloren.',
    function() {
      localStorage.removeItem(STORAGE_KEY);
      renderAll();
      toast('Packliste zur\u00FCckgesetzt');
    },
    { danger: true, confirmLabel: 'Zur\u00FCcksetzen', cancelLabel: 'Abbrechen' }
  );
}

renderAll();
</script>
</body>
</html>
