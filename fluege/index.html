<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fl&uuml;ge - Sizilien 2026</title>
<link rel="stylesheet" href="../shared/styles.css" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<a href="#main-content" class="skip-link">Zum Inhalt springen</a>
<div id="site-nav" data-depth="1" data-title=""></div>

<header>
  <h1>Fl&uuml;ge</h1>
  <p id="header-subtitle">Flugvergleich &amp; Buchungsstatus</p>
</header>

<div class="container" id="main-content">

  <div class="info-box" id="info-box"></div>

  <h2>Flug&uuml;bersicht</h2>

  <div class="flight-summary">
    <div class="flight-summary-card">
      <h3 id="hin-heading"></h3>
      <div class="big-num" id="hin-count">0</div>
      <span class="text-muted text-sm" id="hin-cheapest">Optionen eingetragen</span>
    </div>
    <div class="flight-summary-card">
      <h3 id="rueck-heading"></h3>
      <div class="big-num" id="rueck-count">0</div>
      <span class="text-muted text-sm" id="rueck-cheapest">Optionen eingetragen</span>
    </div>
  </div>

  <h2>Hinfl&uuml;ge</h2>
  <div id="hin-flights"></div>

  <h2>R&uuml;ckfl&uuml;ge</h2>
  <div id="rueck-flights"></div>

  <h2 id="flug-form">Flug hinzuf&uuml;gen</h2>
  <div class="add-form">
    <h3>Neuen Flug eintragen</h3>
    <div class="form-grid">
      <div class="form-group"><label>Person <span class="required">*</span></label><input id="f-person" placeholder="z.B. Sebas"></div>
      <div class="form-group"><label>Richtung <span class="required">*</span></label>
        <select id="f-richtung"><option value="hin">Hinflug</option><option value="rueck">R&uuml;ckflug</option></select>
      </div>
      <div class="form-group"><label>Airline</label><input id="f-airline" placeholder="z.B. Ryanair, Eurowings"></div>
      <div class="form-group"><label>Flugnummer</label><input id="f-flugNr" placeholder="z.B. FR1234"></div>
      <div class="form-group"><label>Von <span class="required">*</span></label><input id="f-von" placeholder="z.B. Berlin (BER)"></div>
      <div class="form-group"><label>Nach <span class="required">*</span></label><input id="f-nach" placeholder="z.B. Palermo (PMO)"></div>
      <div class="form-group"><label>Datum <span class="required">*</span></label><input id="f-datum" type="date"></div>
      <div class="form-group"><label>Abflugzeit</label><input id="f-abflug" type="time"></div>
      <div class="form-group"><label>Ankunftszeit</label><input id="f-ankunft" type="time"></div>
      <div class="form-group"><label>Flugdauer</label><input id="f-dauer" placeholder="z.B. 2h 30m"></div>
      <div class="form-group"><label>Umsteigen</label><input id="f-umsteigen" type="number" value="0" min="0"></div>
      <div class="form-group"><label>Preis (&euro;) <span class="required">*</span></label><input id="f-preis" type="number" placeholder="z.B. 89"></div>
      <div class="form-group"><label>Link zur Buchung</label><input id="f-link" type="url" placeholder="https://..."></div>
      <div class="form-group"><label>Status</label>
        <select id="f-status"><option value="option">Option</option><option value="gebucht">Gebucht</option><option value="offen">Noch offen</option></select>
      </div>
      <div class="form-group full"><label>Notizen</label><input id="f-notizen" placeholder="z.B. Nur Handgep&auml;ck, fr&uuml;h am Flughafen sein"></div>
      <div class="form-actions">
        <button class="btn btn-primary" onclick="addFlug()">Flug hinzuf&uuml;gen</button>
        <button class="btn btn-ghost" onclick="clearForm()">Formular leeren</button>
        <button class="btn btn-secondary" onclick="exportData()">Daten exportieren</button>
      </div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>
<footer></footer>

<script src="../shared/icons.js"></script>
<script src="../shared/config.js"></script>
<script src="../shared/data.js"></script>
<script src="../shared/helpers.js"></script>
<script src="../shared/personen.js"></script>
<script src="../shared/nav.js"></script>
<script src="fluege.js"></script>
<script>
(function() {
  var SECTION = 'fluege';
  var config = SizilienConfig.load();
  var fluege = DataStore.get(SECTION, FLUEGE);

  // ─── Header & Info from config ───
  document.getElementById('header-subtitle').innerHTML =
    'Flugvergleich &amp; Buchungsstatus \u00B7 ' + esc(config.zielflughafen);

  document.getElementById('info-box').innerHTML =
    '<strong>Zielflughafen:</strong> ' + esc(config.zielflughafen) + ' \u00B7 ' +
    '<strong>Reisezeitraum:</strong> ' + SizilienConfig.formatDateRange() + ' \u00B7 ' +
    '<strong>Personen:</strong> ' + config.personen;

  // ─── Summary headings with icons ───
  document.getElementById('hin-heading').innerHTML = Icons.plane({size: 20}) + ' Hinfl\u00FCge';
  document.getElementById('rueck-heading').innerHTML = Icons.plane({size: 20}) + ' R\u00FCckfl\u00FCge';

  // ─── Set default airport in form ───
  var nachField = document.getElementById('f-nach');
  if (nachField && !nachField.value) {
    // Extract short airport name from config, e.g. "Palermo (PMO)" from "Palermo Falcone-Borsellino (PMO)"
    var airport = config.zielflughafen || '';
    var match = airport.match(/\(([^)]+)\)/);
    var city = airport.split(/\s+(Falcone|International|Airport)/i)[0] || airport.split('(')[0].trim();
    nachField.value = match ? city + ' (' + match[1] + ')' : airport;
  }

  // ─── Form button icons (set after Icons is loaded) ───
  var formActions = document.querySelector('.form-actions');
  if (formActions) {
    formActions.innerHTML =
      '<button class="btn btn-primary" onclick="addFlug()">' + Icons.plus({size:16}) + ' Flug hinzuf\u00FCgen</button>' +
      '<button class="btn btn-ghost" onclick="clearForm()">Formular leeren</button>' +
      '<button class="btn btn-secondary" onclick="exportData()">' + Icons.download({size:16}) + ' Daten exportieren</button>';
  }

  // ─── Render ───
  function renderFlights() {
    fluege = DataStore.get(SECTION, FLUEGE);

    var hin = fluege.filter(function(f) { return f.richtung === 'hin'; });
    var rueck = fluege.filter(function(f) { return f.richtung === 'rueck'; });

    document.getElementById('hin-count').textContent = hin.length;
    document.getElementById('rueck-count').textContent = rueck.length;

    var hinMin = hin.length ? Math.min.apply(null, hin.map(function(f) { return f.preis; })) : null;
    var rueckMin = rueck.length ? Math.min.apply(null, rueck.map(function(f) { return f.preis; })) : null;
    document.getElementById('hin-cheapest').textContent = hinMin !== null ? 'G\u00FCnstigster: ' + hinMin + ' \u20AC' : 'Optionen eingetragen';
    document.getElementById('rueck-cheapest').textContent = rueckMin !== null ? 'G\u00FCnstigster: ' + rueckMin + ' \u20AC' : 'Optionen eingetragen';

    document.getElementById('hin-flights').innerHTML = hin.length ? renderList(hin) :
      '<div class="empty-state">' +
        '<div class="icon">' + Icons.plane({size: 48}) + '</div>' +
        '<h3>Noch keine Hinfl\u00FCge</h3>' +
        '<p>F\u00FCge unten den ersten Hinflug hinzu</p>' +
        '<a href="#flug-form" class="btn btn-primary btn-sm">' + Icons.plus({size: 14}) + ' Flug hinzuf\u00FCgen</a>' +
      '</div>';

    document.getElementById('rueck-flights').innerHTML = rueck.length ? renderList(rueck) :
      '<div class="empty-state">' +
        '<div class="icon">' + Icons.plane({size: 48}) + '</div>' +
        '<h3>Noch keine R\u00FCckfl\u00FCge</h3>' +
        '<p>F\u00FCge unten den ersten R\u00FCckflug hinzu</p>' +
        '<a href="#flug-form" class="btn btn-primary btn-sm">' + Icons.plus({size: 14}) + ' Flug hinzuf\u00FCgen</a>' +
      '</div>';
  }

  function renderList(flights) {
    return flights.sort(function(a, b) { return a.preis - b.preis; }).map(function(f) {
      return '<div class="flight-card">' +
        '<div class="flight-route">' +
          '<div class="airports">' + esc(f.von) + '<span class="arrow"> \u2192 </span>' + esc(f.nach) + '</div>' +
          '<div class="details">' +
            '<strong>' + esc(f.person) + '</strong>' +
            (f.airline ? ' \u00B7 ' + esc(f.airline) : '') +
            (f.flugNr ? ' ' + esc(f.flugNr) : '') +
            ' \u00B7 ' + fmt(f.datum) +
            (f.abflug ? ' \u00B7 ' + f.abflug + (f.ankunft ? ' - ' + f.ankunft : '') : '') +
            (f.dauer ? ' (' + esc(f.dauer) + ')' : '') +
            (f.umsteigen > 0 ? ' \u00B7 ' + f.umsteigen + 'x Umsteigen' : ' \u00B7 Direkt') +
          '</div>' +
          (f.notizen ? '<div class="details text-sm" style="margin-top:4px;font-style:italic">' + esc(f.notizen) + '</div>' : '') +
        '</div>' +
        statusBadge(f.status) +
        '<div class="flight-price">' + f.preis + ' \u20AC</div>' +
        (f.link ? '<a href="' + esc(f.link) + '" target="_blank" class="btn btn-primary btn-sm">' + Icons.externalLink({size: 14}) + ' Buchen</a>' : '') +
        '<div class="item-actions">' +
          '<button class="btn-icon" onclick="deleteFlug(' + f.id + ')" title="Flug l\u00F6schen" aria-label="Flug l\u00F6schen">' + Icons.trash({size: 16}) + '</button>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  // ─── Add flight ───
  window.addFlug = function() {
    clearValidation();
    var ok = true;
    ok = validateRequired('f-person', 'Person ist erforderlich') & ok;
    ok = validateRequired('f-von', 'Abflugort ist erforderlich') & ok;
    ok = validateRequired('f-nach', 'Zielort ist erforderlich') & ok;
    ok = validateRequired('f-datum', 'Datum ist erforderlich') & ok;
    ok = validateRequired('f-preis', 'Preis ist erforderlich') & ok;

    if (!ok) {
      toast('Bitte Pflichtfelder ausf\u00FCllen', 'error');
      return;
    }

    var newFlug = {
      person: document.getElementById('f-person').value.trim(),
      richtung: document.getElementById('f-richtung').value,
      airline: document.getElementById('f-airline').value.trim(),
      flugNr: document.getElementById('f-flugNr').value.trim(),
      von: document.getElementById('f-von').value.trim(),
      nach: document.getElementById('f-nach').value.trim(),
      datum: document.getElementById('f-datum').value,
      abflug: document.getElementById('f-abflug').value,
      ankunft: document.getElementById('f-ankunft').value,
      dauer: document.getElementById('f-dauer').value.trim(),
      umsteigen: parseInt(document.getElementById('f-umsteigen').value) || 0,
      preis: parseFloat(document.getElementById('f-preis').value),
      link: document.getElementById('f-link').value.trim(),
      status: document.getElementById('f-status').value,
      notizen: document.getElementById('f-notizen').value.trim()
    };

    fluege = DataStore.add(SECTION, newFlug, FLUEGE);
    renderFlights();
    clearForm();
    toast('Flug hinzugef\u00FCgt!');
  };

  // ─── Delete flight ───
  window.deleteFlug = function(id) {
    var flug = fluege.find(function(f) { return f.id === id; });
    var label = flug ? (flug.von + ' \u2192 ' + flug.nach + ' (' + flug.person + ')') : 'Diesen Flug';

    confirmModal(
      'Flug l\u00F6schen?',
      label + ' wirklich l\u00F6schen? Diese Aktion kann nicht r\u00FCckg\u00E4ngig gemacht werden.',
      function() {
        fluege = DataStore.remove(SECTION, id, FLUEGE);
        renderFlights();
        toast('Flug gel\u00F6scht');
      },
      { confirmLabel: 'L\u00F6schen', danger: true }
    );
  };

  // ─── Clear form ───
  window.clearForm = function() {
    var airport = config.zielflughafen || '';
    var match = airport.match(/\(([^)]+)\)/);
    var city = airport.split(/\s+(Falcone|International|Airport)/i)[0] || airport.split('(')[0].trim();
    var defaultNach = match ? city + ' (' + match[1] + ')' : airport;

    document.querySelectorAll('.add-form input').forEach(function(el) {
      if (el.id === 'f-nach') { el.value = defaultNach; return; }
      if (el.id === 'f-umsteigen') { el.value = '0'; return; }
      el.value = '';
    });
    clearValidation();
  };

  // ─── Export ───
  window.exportData = function() {
    var json = DataStore.exportJSON(SECTION, FLUEGE);
    var blob = new Blob(['const FLUEGE = ' + json + ';\n'], { type: 'application/javascript' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'fluege.js';
    a.click();
    toast('fluege.js exportiert!');
  };

  // ─── Initial render ───
  renderFlights();
})();
</script>
</body>
</html>
